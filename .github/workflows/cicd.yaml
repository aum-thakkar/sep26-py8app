name: Backstage Plat Engg Pipeline
on: 
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Docker
        uses: docker/setup-docker-action@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Shorten Commit hash
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> ${GITHUB_ENV}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: aumthakkar/py8app:${{ env.COMMIT_ID }}
  
    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: orbstack-runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Download yq utility and update the image tag to the latest commit_id
        run: |
          wget -q https://github.com/mikefarah/yq/releases/latest/download/yq_linux_arm64 -O /usr/local/bin/yq &&\
          chmod +x /usr/local/bin/yq

          yq -i '.image.tag="${{ needs.ci.outputs.commit_id}}"' charts/py8app/values.yaml

      - name: Commit the above change to the repo
        uses: EndBug/add-and-commit@v10

      - name: Install argocd utility
        run: |
          VERSION=$(curl -L -s https://raw.githubusercontent.com/argoproj/argo-cd/stable/VERSION)
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/download/v$VERSION/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          sudo chmod +x /usr/local/bin/argocd
          rm argocd-linux-amd64
      
      - name: Login to ArgoCD
        run: | 
          argocd login argocd-server.argocd \
          --username ${{ secrets.ARGOCD_USERNAME }} \
          --password ${{ secrets.ARGOCD_PASSWORD }} \
          --insecure \
          --grpc-web

      - name: GitOps - Install the App using argocd 
        run: |
          REPO="https://github.com/aumthakkar/sep26-py8app.git"

          # If not existing, add 
          argocd app list ${REPO} || argocd repo add ${REPO}

          # Create app is not existing already
          if argocd app get py8app > /dev/null 2>&1; then
            echo "Deleting the app - py8app for a fresh new install"
            argocd app delete py8app
          fi

          argocd app create py8app \
          --dest-namespace dev \
          --dest-server https://kubernetes.default.svc \
          --repo ${REPO} \
          --revision main \
          --sync-option CreateNamespace=true
          --sync-policy manual
          
          argocd app sync py8app
          argocd app wait py8app --timeout 120




  
      

        